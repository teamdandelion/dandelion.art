name: Palette checks
on:
  pull_request:
    paths:
      - "src/lib/palette*.ts"
      - "src/styles/palette.css"
      - "tests/palettes.test.mjs"
      - ".github/workflows/palettes.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/palette*.ts"
      - "src/styles/palette.css"
      - "tests/palettes.test.mjs"
      - ".github/workflows/palettes.yml"
permissions:
  contents: read
jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run test:palettes
      - run: npm run test:music
